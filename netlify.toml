[build]
  publish = "."
  command = "node scripts/seo-build.mjs"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/download"
  to = "/download.html"
  status = 301

[[redirects]]
  from = "/download/latest"
  to = "/downloads/publishrank-2.9.67.zip"
  status = 302

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.news]
  included_files = ["announcements.json", "netlify/functions/lib/shell.json"]

[functions.article-sitemaps]
  included_files = ["announcements.json"]

[functions.discovery]
  included_files = ["announcements.json", "faqs.json"]

[functions.faq]
  included_files = ["faqs.json", "netlify/functions/lib/shell.json"]

[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/faq/"
  to = "/faq"
  status = 301

[[redirects]]
  from = "/news.html"
  to = "/news"
  status = 301

[[redirects]]
  from = "/news/"
  to = "/news"
  status = 301

[[headers]]
  for = "/faqs.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/announcements.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=300"

[functions.search]
  included_files = ["netlify/functions/lib/search-index.json", "faqs.json", "announcements.json"]

[functions.version]
  included_files = ["downloads/*.sha256"]

[[headers]]
  for = "/api/search"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/api/version"
  [headers.values]
    X-Robots-Tag = "noindex"

# Keep build and source files out of search results and off the public site.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tsconfig.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Caching: images change rarely; CSS and JS revalidate within the hour.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
